name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

jobs:
  scaffold-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v5

      # Robolectric fetches the platform jar it emulates at test time into ~/.m2, which
      # setup-gradle does not cache.
      - name: Cache Robolectric platform jars
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('kit/gradle/libs.versions.toml', 'kit/core/testing/src/main/resources/robolectric.properties') }}

      # The real test: a fresh scaffold, not the kit in place. If the script or the rename breaks,
      # this is where it shows — the same path a user takes on a new machine.
      - name: Scaffold a throwaway project
        run: |
          mkdir -p "$RUNNER_TEMP/ci-app"
          cd "$RUNNER_TEMP/ci-app"
          bash "$GITHUB_WORKSPACE/scripts/scaffold.sh" --package com.example.ciapp --name "CI App" \
            --debug-url https://staging.example.com/api/ --release-url https://api.example.com/api/ \
            --staging-url https://staging.example.com/api/
          test ! -e rename-package.sh
          grep -q '^app.applicationId=com.example.ciapp$' gradle.properties
          test -f app/src/main/kotlin/com/example/ciapp/MainActivity.kt

      - name: Unit tests + debug build of the scaffolded project
        working-directory: ${{ runner.temp }}/ci-app
        run: ./gradlew test assembleDebug --console=plain

      - name: Check the APK carries the new identity
        working-directory: ${{ runner.temp }}/ci-app
        run: |
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$aapt2" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -q "package: name='com.example.ciapp'"
          "$aapt2" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -q "application-label:'CI App'"

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: ${{ runner.temp }}/ci-app/**/build/reports/tests/**
          retention-days: 7
          if-no-files-found: ignore
