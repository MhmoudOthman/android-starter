# Read off the test runtime classpath, which is how one copy here reaches every module that
# consumes :core:testing — the alternative is this same line in six modules, drifting apart the
# first time one of them is bumped.
#
# Robolectric can only emulate a platform it ships an android-all jar for. The app compiles against
# 37 and targets it, which is well ahead of that; pinning keeps the suites running instead of
# failing on a missing jar every time the compile SDK moves.
sdk=34
